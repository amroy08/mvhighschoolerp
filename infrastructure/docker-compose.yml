version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mvhs_postgres
    environment:
      POSTGRES_DB: mvhs_erp
      POSTGRES_USER: mvhs_user
      POSTGRES_PASSWORD: mvhs_pass
    ports:
      - "5432:5432"
    volumes:
      - mvhs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvhs_user -d mvhs_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mvhs_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - mvhs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mvhs_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mvhs_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mvhs_postgres_data:
  mvhs_redis_data:
  mvhs_minio_data:
